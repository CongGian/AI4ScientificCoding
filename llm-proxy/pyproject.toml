[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4scientificcoding-llm-gateway"
version = "0.2.0"
description = "Central OpenAI-compatible LLM gateway with PostgreSQL research logging"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_proxy*"]
